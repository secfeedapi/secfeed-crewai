[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secfeed-crewai"
version = "0.1.0"
description = "SEC EDGAR tools for CrewAI agents: 10-K/10-Q sections, financial statements, insider trades, 8-Ks"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["secfeed>=0.1.3", "crewai>=0.80"]
keywords = ["crewai", "sec", "edgar", "10-k", "insider trading", "financial statements", "agents", "tools"]

[project.urls]
Homepage = "https://secfeedapi.com"
Source = "https://github.com/secfeedapi/secfeed-crewai"

[tool.setuptools]
packages = ["secfeed_crewai"]
